<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dashboard Admin - PIK-R CEMARA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root{--primary-green:#00b894;--secondary-green:#55efc4;--dark-text:#2d3436;--light-bg:#f4f9f4;--danger:#ff7675;--warning:#fdcb6e;--info:#0984e3}
        body{font-family:'Poppins',sans-serif;margin:0;background-color:var(--light-bg);color:var(--dark-text)}
        #loginScreen{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,var(--primary-green),var(--secondary-green))}
        .login-box{background:#fff;padding:40px;border-radius:20px;box-shadow:0 15px 35px rgba(0,0,0,.2);width:100%;max-width:400px;text-align:center}
        .login-box h2{margin-top:0;color:var(--primary-green)}
        .input-group{margin-bottom:20px;text-align:left}
        .input-group label{display:block;font-weight:600;margin-bottom:8px;font-size:.9rem}
        .input-group select,.input-group input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-family:'Poppins',sans-serif;box-sizing:border-box;transition:.3s}
        .input-group select:focus,.input-group input:focus{border-color:var(--primary-green);outline:none}
        .btn-login{width:100%;padding:15px;background:var(--dark-text);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;transition:.3s}
        .btn-login:hover{background:var(--primary-green)}
        #dashboardScreen{display:none}
        .navbar{background:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.05);position:sticky;top:0;z-index:10}
        .nav-brand{font-weight:700;color:var(--primary-green);font-size:1.2rem}
        .user-info{display:flex;align-items:center;gap:15px}
        .role-badge{background:#eaf8f5;color:var(--primary-green);padding:5px 15px;border-radius:20px;font-size:.85rem;font-weight:600}
        .btn-logout{background:var(--danger);color:#fff;border:none;padding:8px 15px;border-radius:8px;cursor:pointer;font-weight:700}
        .container{padding:40px 5%;max-width:1200px;margin:auto}
        .table-container{background:#fff;border-radius:15px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,.05);overflow-x:auto}
        table{width:100%;border-collapse:collapse;min-width:800px}
        th,td{padding:15px;text-align:left;border-bottom:1px solid #eee;vertical-align:top}
        th{background:#f8fbf9;color:var(--dark-text);font-weight:600}
        tr:hover{background:#fafafa}
        .status-badge{padding:6px 12px;border-radius:20px;font-size:.8rem;font-weight:700;display:inline-block}
        .status-baru{background:#ffeaa7;color:#d35400}
        .status-review{background:#81ecec;color:#00cec9}
        .status-proses{background:#74b9ff;color:#0984e3}
        .status-selesai{background:#55efc4;color:#00b894}
        .select-status{padding:8px;border-radius:8px;border:1px solid #ddd;font-family:'Poppins';font-size:.85rem;cursor:pointer;background:#fff;width:130px}
        .btn-update{background:var(--primary-green);color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:.85rem;margin-left:5px;font-weight:700}
        .action-row{display:flex;gap:8px;margin-top:10px}
        .btn-view{background:#74b9ff;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.8rem;font-weight:700;flex:1;transition:.3s}
        .btn-view:hover{background:#0984e3}
        .btn-delete{background:#ff7675;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.8rem;font-weight:700;flex:1;transition:.3s}
        .btn-delete:hover{background:#d63031}

        /* ===== CHAT ADMIN ===== */
        .btn-chat{background:#00b894;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.8rem;font-weight:700;flex:1;transition:.3s}
        .btn-chat:hover{background:#00a383}
        #chatOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center;padding:15px}
        #chatBox{background:#fff;width:100%;max-width:560px;height:85vh;max-height:700px;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.3)}
        .chat-head{padding:14px 18px;background:#f8fbf9;border-bottom:2px solid #eee;display:flex;justify-content:space-between;align-items:center}
        .chat-head b{color:var(--primary-green);letter-spacing:1px}
        .chat-head small{display:block;color:#777;font-size:.78rem}
        .chat-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:#888;line-height:1}
        #chatMsgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#fcfefd}
        .cb{max-width:80%;padding:10px 14px;border-radius:16px;font-size:.9rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
        .cb .cm{display:block;font-size:.7rem;opacity:.7;margin-top:4px;white-space:normal}
        .cb-siswa{align-self:flex-start;background:#fff;border:1px solid #e1e8e5;border-bottom-left-radius:4px}
        .cb-siswa .cw{display:block;font-size:.75rem;font-weight:700;color:#0984e3;margin-bottom:3px}
        .cb-admin{align-self:flex-end;background:linear-gradient(135deg,var(--primary-green),var(--secondary-green));color:#fff;border-bottom-right-radius:4px}
        .cb-first{border-style:dashed}
        #chatForm{display:flex;gap:8px;padding:12px;border-top:2px solid #eee}
        #chatText{flex:1;resize:none;padding:11px 14px;border:1px solid #ddd;border-radius:20px;font-family:'Poppins',sans-serif;font-size:.9rem;max-height:110px}
        #chatText:focus{border-color:var(--primary-green);outline:none}
        #chatSend{border:none;background:var(--primary-green);color:#fff;width:46px;border-radius:50%;font-size:1.2rem;cursor:pointer}

        /* ===== NOTIFIKASI & URUTAN ===== */
        .btn-sort{background:#fff;border:1px solid #ddd;border-radius:20px;padding:7px 16px;font-family:'Poppins',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--dark-text)}
        .btn-sort:hover{border-color:var(--primary-green);color:var(--primary-green)}
        tr.row-unread{background:#fffbea}
        tr.row-unread td:first-child{border-left:4px solid #e17055}
        .msg-new{margin-top:8px;font-style:normal;font-size:.82rem;background:#ffe3dc;color:#c0392b;padding:6px 10px;border-radius:8px;font-weight:600}
        .no-urut{display:block;font-size:.72rem;color:#999;font-weight:400}
        #notifBell{display:none;position:fixed;right:20px;bottom:20px;z-index:900;width:60px;height:60px;border-radius:50%;border:none;background:var(--dark-text);color:#fff;font-size:1.6rem;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.3);align-items:center;justify-content:center}
        #notifBell.has{background:#e17055;animation:ring 1.4s infinite}
        @keyframes ring{0%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-14deg)}50%{transform:rotate(0)}}
        #notifCount{position:absolute;top:-4px;right:-4px;background:#d63031;color:#fff;font-size:.72rem;font-weight:700;min-width:22px;height:22px;border-radius:11px;display:none;align-items:center;justify-content:center;padding:0 5px;font-family:'Poppins',sans-serif}
        #notifPanel{display:none;position:fixed;right:20px;bottom:92px;z-index:900;width:330px;max-width:calc(100vw - 40px);max-height:60vh;overflow-y:auto;background:#fff;border-radius:16px;box-shadow:0 15px 40px rgba(0,0,0,.25)}
        .np-head{padding:14px 16px;font-weight:700;border-bottom:2px solid #eee;position:sticky;top:0;background:#fff}
        .np-item{padding:12px 16px;border-bottom:1px solid #f0f0f0;cursor:pointer}
        .np-item:hover{background:#f8fbf9}
        .np-item b{color:var(--primary-green)}
        .np-item .n{float:right;background:#d63031;color:#fff;border-radius:10px;font-size:.72rem;padding:1px 8px;font-weight:700}
        .np-item small{display:block;color:#666;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .np-empty{padding:25px;text-align:center;color:#999;font-size:.88rem}
    </style>
</head>

    <div id="loginScreen">
        <div class="login-box">
            <h2>🛡️ Portal Admin PIK-R</h2>
            <p style="color:#666;font-size:.9rem;margin-bottom:30px">Akses khusus pengelola terenkripsi.</p>
            <form id="formLogin">
                <div class="input-group"><label>Masuk Sebagai:</label><select id="loginRole" required><option value="" disabled selected>Pilih Peran...</option><option value="Guru BK">Guru BK</option><option value="Konselor Sebaya">Konselor Sebaya PIK-R</option><option value="Pembina PIK-R">Pembina PIK-R</option></select></div>
                <div class="input-group"><label>Kata Sandi:</label><input type="password" id="loginPassword" placeholder="***" required></div>
                <button type="submit" class="btn-login">Otorisasi</button>
            </form>
        </div>
    </div>
    <div id="dashboardScreen">
        <nav class="navbar"><div class="nav-brand">🛡️ BPDAT CEMARA</div><div class="user-info"><span class="role-badge" id="displayRole">Admin</span><button class="btn-logout" id="btnLogout">Keluar</button></div></nav>
        <div class="container">
            <h2 style="margin-bottom:5px">Rekap Kotak Curhat</h2>
            <p style="color:#666;margin-bottom:30px">Menampilkan lalu lintas data aman untuk: <strong id="filterTeks">Role</strong>.</p>
            <div style="margin-bottom:15px"><button class="btn-sort" id="btnSort">Urutan: Terlama → Terbaru ⇅</button></div>
            <div class="table-container">
                <table>
                    <thead><tr><th>No. Resi</th><th>Tanggal</th><th>Nama</th><th style="width:30%">Cuplikan Cerita</th><th>Status Saat Ini</th><th style="width:20%">Aksi</th></tr></thead>
                    <tbody id="tableBody"><tr><td colspan="6" style="text-align:center">Menyinkronkan data aman...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- NOTIFIKASI PESAN -->
    <button id="notifBell" title="Pesan masuk">🔔<span id="notifCount">0</span></button>
    <div id="notifPanel"></div>

    <!-- MODAL CHAT -->
    <div id="chatOverlay">
        <div id="chatBox">
            <div class="chat-head"><div><b id="chatKode">-</b><small id="chatInfo">-</small></div><button class="chat-close" id="chatClose" title="Tutup">&times;</button></div>
            <div id="chatMsgs"></div>
            <form id="chatForm"><textarea id="chatText" rows="1" placeholder="Balas siswa..." maxlength="1000" required></textarea><button type="submit" id="chatSend" title="Kirim">➤</button></form>
        </div>
